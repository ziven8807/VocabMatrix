# src/main/resources/application.yml

server:
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vocab_matrix_test}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      ssl:
        enabled: ${REDIS_SSL:false}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            client-name: Google
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            scope:
              - email
              - public_profile
            client-name: Facebook

file:
  upload:
    dir: uploads/avatars/

security:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
    access-token-expiration: 30m
    refresh-token-expiration: 30d
    issuer: "vocabmatrix-backend-service"
    access-audience: "vocabmatrix-api"
    refresh-audience: "vocabmatrix-auth"
    refresh-token-cookie-name: "refresh_token"
    refresh-token-cookie-path: "/"
    cookie-secure: ${COOKIE_SECURE:false}
    # ↓↓↓ 關鍵修改：從 Lax 改成 None
    # Lax  → 只允許 same-site 請求帶 cookie（本地 localhost 沒問題，但跨域會被擋）
    # None → 允許跨域請求帶 cookie（Railway 前後端不同 subdomain 時必須用這個）
    # 注意：SameSite=None 必須搭配 cookie-secure: true，否則瀏覽器會拒絕
    cookie-same-site: "None"

logging:
  level:
    org.springframework.security: DEBUG
    com.vocabmatrix.backend.config: DEBUG
    com.vocabmatrix.backend.auth.filter: DEBUG

app:
  backend-url: ${APP_BACKEND_URL:http://localhost:8080}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  email-verification:
    token-validity-hours: 1
  password-reset:
    token-validity-hours: 1