services:
  postgres:
    image: postgres:16
    container_name: vocabmatrix_postgres
    environment:
      POSTGRES_DB: vocab_matrix_test
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vocabmatrix_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: vocabmatrix_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vocab_matrix_test
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET}
      APP_BACKEND_URL: ${APP_BACKEND_URL}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
      COOKIE_SECURE: false
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://vocabmatrix.com:8080
    container_name: vocabmatrix_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: https://vocabmatrix.com:8080
    depends_on:
      - backend

volumes:
  postgres_data:
